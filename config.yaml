# ─────────────────────────────────────────────────────────────
#  HOT-SWAP: change `model` here, then POST /reload-config
#  No code changes required. Restart not needed via the API.
# ─────────────────────────────────────────────────────────────
# Rate limits (Gemini 2.5 Flash free tier):
#   RPM: 1,000 | TPM: 1,000,000 | RPD: 10,000
#   Worst-case per run: max_steps × retries = 10 × 3 = 30 requests
#   Budget per step: ~input(2000) + thinking(8192) + output(8192) ≈ 18K tokens
#   Budget per run (10 steps): ~180K tokens → ~5 concurrent runs/min within TPM
# ─────────────────────────────────────────────────────────────
llm:
  model: gemini/gemini-2.5-pro   # <- swap this line
  # model: gpt-4o                # OpenAI
  # model: gemini/gemini-1.5-pro # Google
  # model: ollama/llama3         # Local (no API key)
  # model: mistral/mistral-large # Mistral
  temperature: 0.0
  max_tokens: 16384
  thinking_budget: 10000
agent:
  max_steps: 10
  traces_dir: ./traces

# ─────────────────────────────────────────────────────────────
#  MULTI-AGENT ORCHESTRATOR
#  Set use_orchestrator: false to revert to legacy single-agent mode
# ─────────────────────────────────────────────────────────────
agents:
  use_orchestrator: true
  supervisor:
    max_tokens: 512          # Routing is a small JSON output
  research:
    max_steps: 5             # Shallow: 5, Deep: 8 (auto-adjusted)
    max_tokens: 4096
    model: gemini/gemini-2.5-flash  # Flash: ~4× faster for search/summarise; Pro reserved for code gen
  doc_generator:
    max_steps: 10
    max_tokens: 16384        # Large budget for code generation
  general:
    max_steps: 8
    max_tokens: 4096

tools:
  read_file:
    sandbox_dir: ./data
  python_repl:
    timeout_seconds: 30          # Bumped: PPT/PDF gen can be slow
